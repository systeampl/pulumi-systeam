name: release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# This builds the pulumi-resource-systeam plugin binaries (attached to the
# GitHub Release, where Pulumi resolves them from) and publishes the committed
# Python SDK `pulumi_systeam` to PyPI.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   PYPI_API_TOKEN  - a PyPI API token (the token value; username is __token__)
# GITHUB_TOKEN is provided automatically.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release + upload plugin binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history/tags

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser must run FIRST, on a clean tree — it refuses to release from
      # a dirty working directory. It only needs the committed Go sources.
      - name: Release plugin binaries (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Stamp the version into the committed SDK, then build + upload. This runs
      # after GoReleaser so the tree-mutating steps don't trip its dirty check.
      - name: Stamp SDK version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s/^VERSION = \"0.0.0\"\$/VERSION = \"${VERSION}\"/" sdk/python/setup.py
          grep -n '^VERSION' sdk/python/setup.py

      - name: Build + publish Python SDK to PyPI
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine upload --non-interactive --skip-existing sdk/python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
